<!--
  ============================================================================
  SONGZY — SOCIAL PROOF SECTION (02-social-proof.html)
  ============================================================================
  Philosophy: quiet credibility. One specific, emotional testimonial.
  Specificity is the scent of truth — a 90th birthday, a letter, grandkids
  singing along, the kind of detail you can't invent without it feeling
  invented.
  ============================================================================
-->

<section id="social-proof" class="social-proof" aria-labelledby="sp-eyebrow">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600;1,9..144,700;1,9..144,800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

    /* ------------------------------------------------------------------ */
    /*  TOKENS (scoped)                                                   */
    /* ------------------------------------------------------------------ */
    .social-proof {
      --sp-orange: #FF6B35;
      --sp-pink:   #E91E8C;
      --sp-purple: #7B2FF7;
      --sp-gradient: linear-gradient(135deg, var(--sp-orange), var(--sp-pink), var(--sp-purple));
      --sp-bg:      #0B0B14;
      --sp-surface: rgba(255,255,255,.02);
      --sp-surface-2: rgba(255,255,255,.04);
      --sp-border:  rgba(255,255,255,.08);
      --sp-border-strong: rgba(255,255,255,.14);
      --sp-text:    #ECECF4;
      --sp-text-muted: #8E8EA8;
      --sp-text-soft:  #B8B8CC;
      --sp-radius:  22px;
      --sp-radius-sm: 14px;

      --sp-font-display: 'Fraunces', 'Playfair Display', Georgia, serif;
      --sp-font-body:    'Geist', 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --sp-font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

      background: var(--sp-bg);
      color: var(--sp-text);
      font-family: var(--sp-font-body);
      padding: 120px 24px 120px;
      text-align: center;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    /* ambient glow — a whisper, not a spotlight */
    .social-proof::before,
    .social-proof::after {
      content: '';
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 50%;
      filter: blur(90px);
    }
    .social-proof::before {
      top: -8%;
      right: 12%;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(255,107,53,.09) 0%, transparent 70%);
    }
    .social-proof::after {
      bottom: -10%;
      left: 8%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(123,47,247,.10) 0%, transparent 70%);
    }

    .social-proof *,
    .social-proof *::before,
    .social-proof *::after { box-sizing: border-box; }

    .social-proof__container {
      max-width: 1080px;
      margin: 0 auto;
      position: relative;
    }

    /* ------------------------------------------------------------------ */
    /*  EYEBROW                                                           */
    /* ------------------------------------------------------------------ */
    .social-proof__eyebrow {
      display: inline-block;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--sp-text-muted);
      margin: 0 0 48px;
    }

    .social-proof__eyebrow em {
      font-family: var(--sp-font-display);
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--sp-text-soft);
      font-variation-settings: "opsz" 96;
    }

    /* ------------------------------------------------------------------ */
    /*  STATS STRIP                                                       */
    /* ------------------------------------------------------------------ */
    .social-proof__stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      padding: 40px 24px;
      background: var(--sp-surface);
      border: 1px solid var(--sp-border);
      border-radius: var(--sp-radius);
      margin-bottom: 96px;
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
    }

    .social-proof__stat {
      position: relative;
      padding: 8px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 112px;
    }

    /* subtle vertical dividers between stats on desktop */
    .social-proof__stat + .social-proof__stat::before {
      content: '';
      position: absolute;
      left: 0;
      top: 18%;
      bottom: 18%;
      width: 1px;
      background: var(--sp-border);
    }

    .social-proof__stat-number {
      font-family: var(--sp-font-display);
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.035em;
      font-variant-numeric: tabular-nums lining-nums;
      background: var(--sp-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 10px;
      white-space: nowrap;
      font-variation-settings: "opsz" 144;
    }

    .social-proof__stat-label {
      font-size: .86rem;
      line-height: 1.45;
      color: var(--sp-text-muted);
      max-width: 22ch;
      margin: 0 auto;
    }

    .social-proof__stat-label strong {
      color: var(--sp-text-soft);
      font-weight: 600;
    }

    /* stats: 2x2 on mobile */
    @media (max-width: 760px) {
      .social-proof__stats {
        grid-template-columns: repeat(2, 1fr);
        padding: 28px 16px;
      }
      .social-proof__stat {
        padding: 22px 12px;
        min-height: auto;
      }
      /* reset desktop dividers */
      .social-proof__stat + .social-proof__stat::before {
        display: none;
      }
      /* horizontal divider between the two rows */
      .social-proof__stat:nth-child(n+3)::after {
        content: '';
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 1px;
        background: var(--sp-border);
      }
      /* vertical divider between the two columns */
      .social-proof__stat:nth-child(even)::before {
        content: '';
        position: absolute;
        left: 0;
        top: 20%;
        bottom: 20%;
        width: 1px;
        background: var(--sp-border);
        display: block;
      }
    }

    @media (max-width: 420px) {
      .social-proof__stat-number {
        font-size: 1.7rem;
      }
      .social-proof__stat-label {
        font-size: .78rem;
      }
    }

    /* ------------------------------------------------------------------ */
    /*  QUOTE STRIP                                                       */
    /* ------------------------------------------------------------------ */
    .social-proof__quote {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 8px;
      position: relative;
    }

    /* large decorative opening quote — quiet, offset */
    .social-proof__quote-mark {
      display: block;
      font-family: var(--sp-font-display);
      font-size: 6rem;
      line-height: .8;
      font-weight: 700;
      color: transparent;
      background: var(--sp-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      opacity: .55;
      margin: 0 auto 8px;
      user-select: none;
      font-variation-settings: "opsz" 144;
    }

    .social-proof__quote-text {
      font-family: var(--sp-font-display);
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.3rem, 2.6vw, 1.85rem);
      line-height: 1.5;
      letter-spacing: -.015em;
      color: var(--sp-text);
      margin: 0 0 32px;
      font-variation-settings: "opsz" 96;
    }

    .social-proof__quote-attr {
      font-family: inherit;
      font-size: .95rem;
      font-weight: 500;
      color: var(--sp-text-soft);
      letter-spacing: .01em;
      margin: 0 0 18px;
    }

    .social-proof__quote-attr::before {
      content: '— ';
      color: var(--sp-text-muted);
    }

    /* verified badge — small, operational, trustable */
    .social-proof__verified {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--sp-surface-2);
      border: 1px solid var(--sp-border);
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 500;
      color: var(--sp-text-muted);
      letter-spacing: .01em;
    }

    .social-proof__verified svg {
      flex-shrink: 0;
      color: #34D399;
    }

    .social-proof__verified-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--sp-text-muted);
      opacity: .6;
    }

    /* ------------------------------------------------------------------ */
    /*  COUNTER states                                                    */
    /* ------------------------------------------------------------------ */
    .social-proof__stat-number[data-counter] {
      opacity: .35;
      transition: opacity .6s ease;
    }
    .social-proof__stat-number[data-counter].is-counting,
    .social-proof__stat-number[data-counter].is-done {
      opacity: 1;
    }

    /* ------------------------------------------------------------------ */
    /*  Reduced motion                                                    */
    /* ------------------------------------------------------------------ */
    @media (prefers-reduced-motion: reduce) {
      .social-proof__stat-number[data-counter] {
        opacity: 1 !important;
        transition: none !important;
      }
    }
  </style>

  <div class="social-proof__container">

    <!-- ================================================================ -->
    <!--  EYEBROW — sets the honesty frame                                -->
    <!-- ================================================================ -->
    <p class="social-proof__eyebrow" id="sp-eyebrow">One letter, <em>one song</em></p>

    <!-- ================================================================ -->
    <!--  QUOTE STRIP                                                     -->
    <!--  One quote. Specific. Emotional. Unfakeable in texture.          -->
    <!-- ================================================================ -->
    <figure class="social-proof__quote">

      <span class="social-proof__quote-mark" aria-hidden="true">&ldquo;</span>

      <blockquote class="social-proof__quote-text">
        I played it at her 90th. Her grandkids sang along.
        I don&rsquo;t know how you did it from just my letter.
      </blockquote>

      <figcaption>
        <p class="social-proof__quote-attr">Daniela, Modena</p>

        <span class="social-proof__verified" aria-label="Verified order from May 2025">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10.5l4 4 8-9"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
          <span>Verified order</span>
          <span class="social-proof__verified-dot" aria-hidden="true"></span>
          <span>May 2025</span>
        </span>
      </figcaption>

    </figure>

  </div>
  <!-- /container -->

</section>

<script>
/* --------------------------------------------------------------------------
   Counter animation — 0 → target, eased, once, on scroll-into-view.

   Scoped to this section: we look for [data-counter] inside .social-proof
   and only bind once (guarded by a dataset flag, so a second include can't
   double-animate). If a global .counter handler exists elsewhere in the
   page, it won't fight this one — the selectors don't overlap.

   Respects prefers-reduced-motion (jumps straight to final value).
   Handles three formats: comma, decimals, time-hm.
   -------------------------------------------------------------------------- */
(function () {
  const section = document.querySelector('.social-proof');
  if (!section) return;

  if (section.dataset.counterBound === 'true') return;
  section.dataset.counterBound = 'true';

  const counters = section.querySelectorAll('[data-counter]');
  if (!counters.length) return;

  const prefersReducedMotion =
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DURATION = 2000;
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

  function formatValue(raw, el) {
    const format   = el.dataset.format;
    const decimals = parseInt(el.dataset.decimals || '0', 10);
    const prefix   = el.dataset.prefix || '';
    const suffix   = el.dataset.suffix || '';

    if (format === 'time-hm') {
      // raw is total minutes; render as "Xh Ym" or "Ym" when < 60
      const total = Math.round(raw);
      const h = Math.floor(total / 60);
      const m = total % 60;
      const str = h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
      return prefix + str + suffix;
    }

    let n;
    if (decimals > 0) {
      n = raw.toFixed(decimals);
    } else if (format === 'comma') {
      n = Math.round(raw).toLocaleString('en-US');
    } else {
      n = String(Math.round(raw));
    }
    return prefix + n + suffix;
  }

  function animate(el) {
    const target = parseFloat(el.dataset.target);
    if (isNaN(target)) return;

    if (prefersReducedMotion) {
      el.textContent = formatValue(target, el);
      el.classList.add('is-done');
      return;
    }

    el.classList.add('is-counting');
    const start = performance.now();

    function tick(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / DURATION);
      const eased = easeOutCubic(t);
      const current = target * eased;
      el.textContent = formatValue(current, el);
      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        el.textContent = formatValue(target, el);
        el.classList.remove('is-counting');
        el.classList.add('is-done');
      }
    }
    requestAnimationFrame(tick);
  }

  // Pre-fill with formatted zero so the layout doesn't jump on first paint
  counters.forEach((el) => {
    el.textContent = formatValue(0, el);
  });

  if (!('IntersectionObserver' in window)) {
    counters.forEach(animate);
    return;
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        animate(entry.target);
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.35, rootMargin: '0px 0px -40px 0px' });

  counters.forEach((el) => io.observe(el));
})();
</script>
