<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your Songzy song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="icon" href="/logo-songzy.jpg" type="image/jpeg">
<meta property="og:type" content="music.song">
<meta property="og:title" content="A song written from your words">
<meta property="og:description" content="A custom song for someone who matters. Written by Songzy.">
<script src="/api/env.js"></script>
<script defer src="/scripts/analytics.js"></script>
<style>
  :root{--or:#FF6B35;--pink:#E91E8C;--pu:#7B2FF7;--bg:#0f0f1a;--el:#17172a;--el2:#1f1f38;--txt:#f5f3ee;--mut:#a8a3b5;--line:#2c2c48;--grad:linear-gradient(90deg,var(--or),var(--pink),var(--pu));}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Poppins',sans-serif;line-height:1.6;min-height:100vh;
    background-image:
      radial-gradient(ellipse 900px 600px at 10% -5%, rgba(255,107,53,.10) 0%, transparent 60%),
      radial-gradient(ellipse 900px 700px at 95% 20%, rgba(233,30,140,.10) 0%, transparent 60%),
      radial-gradient(ellipse 1200px 900px at 50% 110%, rgba(123,47,247,.12) 0%, transparent 65%);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
    opacity:.06;mix-blend-mode:overlay}
  main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:48px 24px 80px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--txt);text-decoration:none;margin-bottom:28px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--grad)}
  .cover{width:min(360px,80vw);aspect-ratio:1;border-radius:16px;margin:0 auto 28px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.6);background:var(--el2)}
  .cover.placeholder{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(233,30,140,.18),rgba(123,47,247,.18));font-family:'Fraunces',serif;font-size:3rem;color:rgba(255,255,255,.4);letter-spacing:.03em}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.8rem,4.2vw,2.6rem);line-height:1.15;letter-spacing:-0.01em;margin:0 0 8px}
  h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--mut);font-size:.98rem;margin:0 0 28px}
  audio{width:100%;max-width:560px;margin:0 auto 28px;display:block;border-radius:12px}
  audio::-webkit-media-controls-panel{background:var(--el)}
  .lyrics{max-width:560px;margin:28px auto 0;text-align:left;background:var(--el);border:1px solid var(--line);border-radius:14px;padding:26px 28px;font-size:1.02rem;line-height:1.85;white-space:pre-wrap;color:#eae6dd;font-family:'Fraunces',Georgia,serif;font-weight:400}
  .lyrics h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--pink);font-family:'Poppins',sans-serif;font-weight:600;margin:0 0 14px}
  .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
  button,.btn{font-family:inherit;font-weight:600;font-size:.96rem;padding:12px 22px;border-radius:999px;cursor:pointer;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:#fff}
  .btn.primary{background:var(--grad);box-shadow:0 6px 24px rgba(233,30,140,.3)}
  .btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--txt);border-color:var(--pink)}
  .state{padding:60px 20px;color:var(--mut);font-size:1rem}
  .err{color:#ffaaaa}
  footer{text-align:center;padding:30px 20px;color:var(--mut);font-size:.82rem;position:relative;z-index:1}
  footer a{color:var(--mut)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><span class="dot"></span> Songzy</a>
  <div id="root" class="state">Loading your song…</div>
</main>
<footer>A song by Songzy · <a href="/">songzy.com</a></footer>

<script>
(function(){
  'use strict';
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // The slug lives in the path (/m/<slug>) thanks to vercel.json rewrite.
  var parts = location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
  var slug = parts[parts.length - 1];
  if (!slug || slug === 'm' || slug === 'index.html') slug = new URLSearchParams(location.search).get('id') || '';
  var root = document.getElementById('root');

  if (!slug) { root.innerHTML = '<div class="err">Missing song ID.</div>'; return; }

  fetch('/api/order/' + encodeURIComponent(slug))
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, status: r.status, d: d }; }); })
    .then(function(r){
      if (!r.ok) {
        root.innerHTML = '<div class="err">' + (r.status === 404
          ? 'Your song isn\'t ready yet. We\'ll email as soon as it is.'
          : 'Could not load your song.') + '</div>';
        return;
      }
      var d = r.d;
      var coverHtml = d.coverUrl
        ? '<img class="cover" src="' + esc(d.coverUrl) + '" alt="Song cover">'
        : '<div class="cover placeholder">' + esc((d.recipientName || 'S').charAt(0).toUpperCase()) + '</div>';
      var title = d.recipientName
        ? 'A song for <em>' + esc(d.recipientName) + '</em>'
        : 'A song, <em>written from your words</em>';
      var metaBits = [];
      if (d.voiceName) metaBits.push('Voice: ' + esc(d.voiceName));
      if (d.genre)     metaBits.push(esc(d.genre));
      var meta = metaBits.length ? '<p class="meta">' + metaBits.join(' · ') + '</p>' : '';

      root.className = '';
      root.innerHTML =
        coverHtml +
        '<h1>' + title + '</h1>' +
        meta +
        '<audio id="player" controls preload="metadata" src="' + esc(d.mp3Url) + '"></audio>' +
        (d.lyrics ? '<div class="lyrics"><h2>Lyrics</h2>' + esc(d.lyrics) + '</div>' : '') +
        '<div class="actions">' +
          '<a class="btn primary" href="' + esc(d.mp3Url) + '" download>Download MP3</a>' +
          '<button class="btn ghost" id="copyLink">Copy share link</button>' +
        '</div>';

      document.getElementById('copyLink').onclick = function(){
        try {
          navigator.clipboard.writeText(location.href);
          this.textContent = 'Copied ✓';
          setTimeout(function(){ document.getElementById('copyLink').textContent = 'Copy share link'; }, 2000);
        } catch(e){}
      };

      try { window.songzyTrack && window.songzyTrack('SongOpened', { slug: slug }); } catch(e){}
    })
    .catch(function(e){
      root.innerHTML = '<div class="err">Network error: ' + esc(e.message) + '</div>';
    });
})();
</script>
</body>
</html>
